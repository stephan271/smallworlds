<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 945" width="1280" height="945" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Where the automatic update process runs: Renovate and the repositories on GitHub, the Canary Follower and its checks inside Ring 0's k3s, the Ring 0 Steward on a runner beside k3s on the same server, Claude at Anthropic, and the Operator, reached by ntfy">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect width="1280" height="945" fill="#ffffff"/>

  <!-- ===================== GitHub ===================== -->
  <rect x="20" y="20" width="1240" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="38" y="46" font-size="18" font-weight="800" fill="#0f172a">GitHub</text>

  <!-- Renovate -->
  <rect x="40" y="62" width="190" height="168" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#334155" font-size="13">
    <text x="135" y="90" font-size="17" font-weight="700" fill="#0f172a">Renovate</text>
    <text x="135" y="111">GitHub App, runs on</text>
    <text x="135" y="129">Mend's servers</text>
    <text x="135" y="158">one PR per update</text>
    <text x="135" y="182" font-family="ui-monospace, Menlo, monospace" font-size="12">ring0-queue</text>
    <text x="135" y="197">minor · patch · digest</text>
    <text x="135" y="219"><tspan font-family="ui-monospace, Menlo, monospace" font-size="12">ring0-major</tspan> majors</text>
  </g>

  <!-- Base repository -->
  <rect x="260" y="62" width="500" height="168" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="510" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">stephan271/smallworlds · public base</text>
  <g font-size="13.5" fill="#334155">
    <text x="282" y="118">• update PRs, waiting in the queue</text>
    <text x="282" y="142">• <tspan font-weight="700">main</tspan>, each commit with the status <tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">ring0/verified</tspan></text>
    <text x="282" y="166">• the Steward's fix PRs (label <tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">steward</tspan>)</text>
    <text x="282" y="190">• branch <tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">ring-state</tspan>: <tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">ring0.json</tspan></text>
    <text x="282" y="214">• release tags <tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">v1.x</tspan>, cut from a commit green ≥ 72 h</text>
  </g>

  <!-- Private overlay -->
  <rect x="790" y="62" width="230" height="168" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#334155" font-size="13">
    <text x="905" y="88" font-size="15" font-weight="700" fill="#9a3412">my-canary-installation</text>
    <text x="905" y="108">private · Ring 0's overlay</text>
    <text x="905" y="138">• incidents (issues),</text>
    <text x="905" y="156">with Ring 0's logs</text>
    <text x="905" y="184">• workflow <tspan font-family="ui-monospace, Menlo, monospace" font-size="12">steward.yml</tspan>,</text>
    <text x="905" y="202">started by a label</text>
  </g>

  <!-- Board -->
  <rect x="1050" y="62" width="190" height="168" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#334155" font-size="13">
    <text x="1145" y="90" font-size="17" font-weight="700" fill="#0f172a">Ring 0 board</text>
    <text x="1145" y="111">GitHub Pages</text>
    <text x="1145" y="129">public, read-only</text>
    <text x="1145" y="158">draws <tspan font-family="ui-monospace, Menlo, monospace" font-size="12">ring0.json</tspan></text>
    <text x="1145" y="176">as cards</text>
  </g>

  <!-- ring-state -> board -->
  <path d="M740,62 V38 H1145 V58" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="942" y="33" text-anchor="middle" font-size="12" fill="#64748b">read every few minutes</text>

  <!-- ===================== Ring 0 ===================== -->
  <rect x="20" y="300" width="860" height="372" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="38" y="326" font-size="18" font-weight="800" fill="#9a3412">Ring 0</text>
  <text x="38" y="657" font-size="13.5" font-weight="600" fill="#9a3412">one Contabo VPS, 8 CPUs, 24 GB · every app with example data · follows main</text>

  <!-- k3s -->
  <rect x="40" y="340" width="560" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="586" y="358" text-anchor="end" font-size="12" fill="#94a3b8">inside k3s</text>

  <rect x="60" y="372" width="250" height="122" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <g text-anchor="middle" fill="#7c2d12" font-size="13">
    <text x="185" y="398" font-size="16" font-weight="700">Canary Follower</text>
    <text x="185" y="419">one pod, namespace canary-follower</text>
    <text x="185" y="440">reads main every 5 min</text>
    <text x="185" y="461">verdicts · merge queue</text>
    <text x="185" y="482">reverts · incidents</text>
  </g>

  <rect x="330" y="372" width="250" height="122" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#334155" font-size="13">
    <text x="455" y="398" font-size="16" font-weight="700" fill="#0f172a">Argo CD</text>
    <text x="455" y="422">syncs every Application</text>
    <text x="455" y="443">from main and the overlay</text>
    <text x="455" y="464">hard refresh, full sync</text>
  </g>

  <rect x="60" y="510" width="250" height="106" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#334155" font-size="13">
    <text x="185" y="535" font-size="15" font-weight="700" fill="#0f172a">checks Jobs</text>
    <text x="185" y="556">e2e with real sign-ins</text>
    <text x="185" y="576">example members' data read back</text>
    <text x="185" y="596">storage write and read back</text>
  </g>

  <rect x="330" y="510" width="250" height="106" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#334155" font-size="13">
    <text x="455" y="535" font-size="15" font-weight="700" fill="#0f172a">the apps</text>
    <text x="455" y="556">CNPG backup before an update</text>
    <text x="455" y="576">that may migrate a database</text>
    <text x="455" y="596">Alertmanager → ntfy</text>
  </g>

  <!-- Steward runner, beside k3s -->
  <rect x="620" y="340" width="240" height="292" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <g text-anchor="middle" fill="#164e63" font-size="13">
    <text x="740" y="366" font-size="16" font-weight="700">Ring 0 Steward</text>
    <text x="740" y="386">beside k3s, same server</text>
    <text x="740" y="414">GitHub Actions runner</text>
    <text x="740" y="432">as the Linux user steward</text>
    <text x="740" y="460" font-size="14.5" font-weight="700">Claude Code</text>
    <text x="740" y="488">kubectl as ServiceAccount</text>
    <text x="740" y="506">ring0-steward:</text>
    <text x="740" y="524">no Secrets, no exec</text>
    <text x="740" y="552">three attempts, then a person</text>
    <text x="740" y="572">at most six runs a day</text>
    <text x="740" y="600">GitHub as its own App</text>
    <text x="740" y="618">smallworlds-steward</text>
  </g>

  <!-- ===================== Right column ===================== -->
  <rect x="910" y="300" width="350" height="92" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#3b0764" font-size="13">
    <text x="1085" y="328" font-size="16" font-weight="700">Claude · Anthropic</text>
    <text x="1085" y="350">the Steward's model, on a Claude Pro</text>
    <text x="1085" y="369">subscription (token in the overlay)</text>
  </g>

  <rect x="910" y="410" width="350" height="132" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#14532d" font-size="13">
    <text x="1085" y="438" font-size="16" font-weight="700">You, the Operator</text>
    <text x="1085" y="461">phone: ntfy, only when a person is needed</text>
    <text x="1085" y="482">review the Steward's PRs on protected paths</text>
    <text x="1085" y="503">tag a release from a verified commit</text>
    <text x="1085" y="524">merge it into Ring 1</text>
  </g>

  <rect x="910" y="560" width="350" height="90" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#0c4a6e" font-size="13">
    <text x="1085" y="586" font-size="15" font-weight="700">Ring 1 · smallworlds.network (OVH)</text>
    <text x="1085" y="607">Ring 2 · every other community</text>
    <text x="1085" y="628">adopt a release tag by a deliberate merge</text>
  </g>

  <!-- ===================== Arrows (white halo under each) ===================== -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
    <path d="M185,372 V274 H400 V236"/>
    <path d="M290,372 V290 H820 V236"/>
    <path d="M990,232 V270 H845 V336"/>
    <path d="M700,338 V236"/>
  </g>

  <!-- 1 Renovate opens PRs -->
  <path d="M230,140 H256" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- 2 follower merges one queued PR, posts the verdict -->
  <path d="M185,372 V274 H400 V236" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- 3 follower drives Argo CD and the checks -->
  <path d="M310,433 H326" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M185,494 V506" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- 4 incident -->
  <path d="M290,372 V290 H820 V236" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <!-- 5 label starts the Steward -->
  <path d="M990,232 V270 H845 V336" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <!-- 6 fix PR -->
  <path d="M700,338 V236" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <!-- Steward: thinks with Claude, reads and acts on Ring 0 -->
  <path d="M860,346 H906" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <path d="M620,563 H584" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <!-- 7 ntfy -->
  <path d="M880,476 H906" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- number badges -->
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff">
    <circle cx="243" cy="122" r="11" fill="#334155"/><text x="243" y="127">1</text>
    <circle cx="290" cy="274" r="11" fill="#334155"/><text x="290" y="279">2</text>
    <circle cx="318" cy="411" r="11" fill="#334155"/><text x="318" y="416">3</text>
    <circle cx="560" cy="290" r="11" fill="#b91c1c"/><text x="560" y="295">4</text>
    <circle cx="920" cy="270" r="11" fill="#0e7490"/><text x="920" y="275">5</text>
    <circle cx="700" cy="262" r="11" fill="#0e7490"/><text x="700" y="267">6</text>
    <circle cx="893" cy="458" r="11" fill="#15803d"/><text x="893" y="463">7</text>
  </g>
  <text x="882" y="364" text-anchor="middle" font-size="11" fill="#0e7490">thinks</text>
  <text x="602" y="555" text-anchor="middle" font-size="11" fill="#0e7490">reads,</text>
  <text x="602" y="580" text-anchor="middle" font-size="11" fill="#0e7490">acts</text>

  <!-- ===================== Legend ===================== -->
  <g font-size="14.5" fill="#1e293b">
    <text x="40" y="715" font-size="16" font-weight="800" fill="#0f172a">One update, start to finish</text>
    <g font-weight="800" text-anchor="middle" fill="#ffffff" font-size="12">
      <circle cx="50" cy="741" r="10" fill="#334155"/><text x="50" y="745">1</text>
      <circle cx="50" cy="767" r="10" fill="#334155"/><text x="50" y="771">2</text>
      <circle cx="50" cy="793" r="10" fill="#334155"/><text x="50" y="797">3</text>
      <circle cx="50" cy="819" r="10" fill="#b91c1c"/><text x="50" y="823">4</text>
      <circle cx="50" cy="845" r="10" fill="#0e7490"/><text x="50" y="849">5</text>
      <circle cx="50" cy="871" r="10" fill="#0e7490"/><text x="50" y="875">6</text>
      <circle cx="50" cy="897" r="10" fill="#15803d"/><text x="50" y="901">7</text>
    </g>
    <text x="70" y="746">Renovate opens a PR for each upstream release; minor, patch and digest updates are labelled <tspan font-family="ui-monospace, Menlo, monospace" font-size="13">ring0-queue</tspan>, majors <tspan font-family="ui-monospace, Menlo, monospace" font-size="13">ring0-major</tspan>.</text>
    <text x="70" y="772">While main's head is verified, the follower squash-merges one queued PR, so each verdict is about one update.</text>
    <text x="70" y="798">It backs up databases the update may migrate, has Argo CD sync, runs smoke, checks Jobs and 5 quiet minutes, and posts <tspan font-family="ui-monospace, Menlo, monospace" font-size="13">ring0/verified</tspan>.</text>
    <text x="70" y="824">Rejected: a plain update is reverted at once. Anything else, a stuck queue, or the next major opens an incident in the private overlay.</text>
    <text x="70" y="850">The label <tspan font-family="ui-monospace, Menlo, monospace" font-size="13">steward-requested</tspan> starts the Steward on Ring 0's server: it reads Ring 0, thinks with Claude, and opens its own PR.</text>
    <text x="70" y="876">Armed, it adds <tspan font-family="ui-monospace, Menlo, monospace" font-size="13">ring0-queue</tspan> itself; the follower merges the fix even while main is red, and Ring 0 judges it like any update.</text>
    <text x="70" y="902">A person hears of it only by ntfy: three failed attempts, data missing after a migration, or a PR on a path that judges Ring 0.</text>
  </g>
  <text x="40" y="931" font-size="12.5" fill="#64748b">Nothing here reaches a real community: Ring 1 and Ring 2 move only when someone merges a release tag into their overlay.</text>
</svg>
