# Stands in for what bases/keycloak-client-job would create.
# immich-server mounts client-secret as IMMICH_OAUTH_CLIENT_SECRET and will
# not start without it. Nothing in the lab authenticates against Keycloak;
# log in to Immich locally via /auth/login?autoLaunch=0.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: immich
type: Opaque
stringData:
  clientId: immich
  client-secret: lab-not-a-real-secret
