name: Publish Operator Console image

# The in-cluster Operator Console is the one part of SmallWorlds that needs a
# container image of its own: every other tenant runs an upstream image or, like
# the Hermes and Remediation agents, its source straight from a ConfigMap.
#
# The image is published by tag. A cluster only picks it up when its GitOps
# Overlay bumps the pinned SmallWorlds release, so publishing here changes
# nothing anywhere on its own.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Existing SmallWorlds tag to build, for example v1.2.31
        required: true
        type: string
      publish:
        description: Push the image to the registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/smallworlds-operator-console

jobs:
  image:
    if: github.repository == 'stephan271/smallworlds'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release }}
          fetch-depth: 0

      - name: Validate the release tag
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE"

      # The image embeds the client and the assessment engine, so the same
      # checks that gate a launcher release gate this one. An image that builds
      # but whose console cannot authorize a request is worse than no image.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: operator-console/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: operator-console/web/package-lock.json

      # The client is generated, never committed, and internal/webui embeds it
      # with `//go:embed all:dist`. Without this step every Go command fails
      # before it starts, on a missing directory rather than on anything real.
      - name: Build the embedded client
        working-directory: operator-console/web
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run build

      - name: Verify the console
        working-directory: operator-console
        run: |
          set -euo pipefail
          test -z "$(gofmt -l . | grep -v '^web/' || true)"
          go vet ./...
          go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: operator-console
          file: operator-console/Dockerfile
          # arm64 as well as amd64: a Local Deployment Mode Cluster Node is
          # often an ARM machine, and the console has to run there too.
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          build-args: |
            VERSION=${{ inputs.release }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.release }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release }}
          provenance: false

      - name: Report the published digest
        if: inputs.publish
        run: |
          set -euo pipefail
          echo "Published ${IMAGE}:${RELEASE}"
          echo "Pin this tag in infrastructure/kubernetes/tenants/operator-console/deployment.yaml"
        env:
          RELEASE: ${{ inputs.release }}
