# SmallWorlds login theme (docs/adr/0059): keycloak.v2 in the join page's
# colours and type, member-facing German in the du form, and a passkey page
# that names the account and asks no questions.
#
# Overrides, to re-check against keycloak.v2 on every Keycloak upgrade:
#   webauthn-register.ftl            — copy of keycloak.v2's, see its header
#   resources/js/webauthnRegister.js — copy of base's, see its header
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/smallworlds.css
darkMode=true
