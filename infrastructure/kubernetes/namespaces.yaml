# The Operator Console is DEACTIVATED (2026-08-23) — see the note in
# kustomization.yaml. Nothing runs in this namespace while that holds, so it is
# not created; restore this block when the console is re-activated.
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: operator-console
---
apiVersion: v1
kind: Namespace
metadata:
  name: pod-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-setup-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "patch", "apply", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
