# Bucket-to-bucket copy: operational Garage -> garage-backup (docs/adr/0048).
#
# For data whose primary home is object storage rather than a PVC. Nextcloud is
# the first consumer and the urgent one: users' files ARE the `nextcloud`
# bucket, `pv-backup-job` only covers /var/www/html, and before this the only
# other copy was the offsite mirror.
#
# Deletions are preserved, not mirrored. A plain `rclone sync` would remove a
# file here as soon as a user deleted it there, which is a mirror rather than a
# Recovery Point; --backup-dir moves superseded objects into a dated prefix
# instead. Note this makes the backup grow monotonically — it is pruned by the
# offsite lifecycle rule, not here.
#
# Consumers patch S3_BUCKET. Credentials come from the two secrets the
# garage-init-job creates: garage-secret on the operational side (source) and
# garage-secret-backup on the backup side (destination). Endpoint, region and
# the real bucket name travel in the same secrets (docs/adr/0053) — on an
# external provider the two buckets carry a prefix and differ from each other,
# so S3_BUCKET is only the fallback for a secret written before those keys
# existed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.74@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%d)
                  SRC="${SRC_BUCKET:-$S3_BUCKET}"
                  DST="${DST_BUCKET:-$S3_BUCKET}"
                  echo "Backing up src:${SRC} -> dst:${DST}/current"
                  # --backup-dir must sit outside the destination path, or the
                  # next run would try to sync the retained versions too.
                  # Memory is what bounds --transfers: each one buffers a
                  # multipart upload, and --fast-list holds the whole listing.
                  # At 16 the job was OOM-killed once a bucket held a real
                  # library, and failed all its retries the same way.
                  # Two buckets at one service under one key: let the service
                  # copy between them, so the objects never pass through this
                  # pod. Anything else has to be streamed.
                  ACROSS=""
                  if [ "$RCLONE_CONFIG_SRC_ENDPOINT" = "$RCLONE_CONFIG_DST_ENDPOINT" ] &&
                     [ "$RCLONE_CONFIG_SRC_ACCESS_KEY_ID" = "$RCLONE_CONFIG_DST_ACCESS_KEY_ID" ]; then
                    ACROSS="--server-side-across-configs"
                    echo "Same service and key on both sides: copying server-side."
                  fi
                  # --update --use-server-modtime: copy only what changed at the
                  # source since it was last copied here, judged by each side's
                  # own Last-Modified. The default (size, then rclone's mtime
                  # metadata, then MD5) cannot settle on an object the app
                  # uploaded multipart — it has no MD5 — and a copy does not
                  # carry the source's time, so every such object counted as
                  # changed on every run: recopied nightly, the identical old
                  # copy filed under versions/. On a photo library that was
                  # ~150 GiB a night of duplicates (2026-10-14, Databucket).
                  rclone sync "src:${SRC}" "dst:${DST}/current" \
                    --backup-dir "dst:${DST}/versions/${STAMP}" \
                    --update --use-server-modtime \
                    --fast-list --transfers 4 --checkers 32 $ACROSS \
                    -v --stats-one-line
                  echo "Backup completed successfully."
              env:
                - name: S3_BUCKET
                  value: "REPLACE_ME_IN_PATCH"
                # Source: the operational instance, where the app writes.
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret
                      key: endpointURL
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret
                      key: region
                - name: SRC_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret
                      key: bucket
                      optional: true
                - name: RCLONE_CONFIG_SRC_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret
                      key: accessKey
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret
                      key: secretKey
                # Destination: the backup instance, on the separate volume.
                - name: RCLONE_CONFIG_DST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DST_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_DST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret-backup
                      key: endpointURL
                - name: RCLONE_CONFIG_DST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret-backup
                      key: region
                - name: DST_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret-backup
                      key: bucket
                      optional: true
                - name: RCLONE_CONFIG_DST_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret-backup
                      key: accessKey
                - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-secret-backup
                      key: secretKey
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
