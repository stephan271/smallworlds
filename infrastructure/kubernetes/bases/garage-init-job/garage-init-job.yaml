apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  template:
    spec:
      serviceAccountName: setup-sa
      containers:
        - name: setup
          image: docker.io/alpine/k8s:1.36.2
          env:
            # Which Garage instance each half of this job talks to. Both are
            # stated outright and the script refuses to run without them: a
            # silent fallback would put Recovery Points on the volume the split
            # exists to get them off (docs/adr/0048) — the exact failure this
            # is meant to prevent, arriving quietly.
            #
            # The tenant's own bucket is operational storage for an app. For
            # pod-gateway the "tenant bucket" IS the archive, so that tenant
            # patches this to garage-backup-system.
            - name: TENANT_BUCKET_NAMESPACE
              value: garage-system
            - name: GARAGE_BACKUP_NAMESPACE
              value: garage-backup-system
            - name: GARAGE_BACKUP_ENDPOINT
              value: http://garage-backup.garage-backup-system.svc.cluster.local:3900
            # S3 endpoint of the operational instance. Not used for a tenant
            # that points TENANT_BUCKET_NAMESPACE at the backup instance — the
            # script follows the namespace, so pod-gateway's existing patch
            # keeps meaning what it says.
            - name: GARAGE_ENDPOINT
              value: http://garage.garage-system.svc.cluster.local:3900
          command:
            - /bin/bash
            - -c
            - |
              set -e

              : "${GARAGE_BACKUP_NAMESPACE:?must name the backup Garage namespace}"
              : "${GARAGE_BACKUP_ENDPOINT:?must give the backup Garage S3 endpoint}"
              : "${TENANT_BUCKET_NAMESPACE:?must name the instance for the tenant bucket}"

              TENANT_NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

              # Where a bucket lives travels with its credential: endpoint,
              # region and bucket name sit in the same Secret as the key, so a
              # consumer never has to know whether that is an in-cluster Garage
              # or an external provider (docs/adr/0053). Applied on every run,
              # including to a Secret that already exists — a cluster installed
              # before these keys were introduced gets them on its next sync.
              describe_secret() {
                local name="$1" endpoint="$2" region="$3" bucket="$4"
                local host="${endpoint#*://}" ssl="false"
                [[ "$endpoint" == https://* ]] && ssl="true"
                kubectl patch secret "$name" -n "$TENANT_NAMESPACE" --type merge -p \
                  "{\"stringData\":{\"endpointURL\":\"$endpoint\",\"endpointHost\":\"${host%/}\",\"useSSL\":\"$ssl\",\"region\":\"$region\",\"bucket\":\"$bucket\"}}"
              }

              # --- External object storage (docs/adr/0053) ---
              # The installer plants this Secret only when the operator chose an
              # external S3 provider; there is then no Garage to wait for. Its
              # presence is the whole switch, so say which way it went.
              EXTERNAL_SECRET=smallworlds-object-storage
              ext() {
                kubectl get secret "$EXTERNAL_SECRET" -n default -o jsonpath="{.data.$1}" 2>/dev/null | base64 -d
              }
              if kubectl get secret "$EXTERNAL_SECRET" -n default >/dev/null 2>&1; then
                echo "Object storage: EXTERNAL (default/$EXTERNAL_SECRET is present) — Garage is not used."
                PREFIX=$(ext bucketPrefix)
                P_ENDPOINT=$(ext endpoint); P_REGION=$(ext region)
                P_KEY=$(ext accessKeyId);   P_SECRET=$(ext secretAccessKey)
                # Recovery Points may go to a second account or provider. Left
                # unset they share the primary one, in buckets of their own.
                B_ENDPOINT=$(ext backupEndpoint); B_REGION=$(ext backupRegion)
                B_KEY=$(ext backupAccessKeyId);   B_SECRET=$(ext backupSecretAccessKey)
                B_ENDPOINT="${B_ENDPOINT:-$P_ENDPOINT}"; B_REGION="${B_REGION:-$P_REGION}"
                B_KEY="${B_KEY:-$P_KEY}";                B_SECRET="${B_SECRET:-$P_SECRET}"
                for required in PREFIX P_ENDPOINT P_REGION P_KEY P_SECRET; do
                  if [[ -z "${!required}" ]]; then
                    echo "Error: default/$EXTERNAL_SECRET is incomplete ($required is empty)."
                    exit 1
                  fi
                done

                # Create the bucket unless it is already there. Plain SigV4 over
                # curl, path-style, so no provider CLI is needed. A key that may
                # not create buckets is fine as long as the bucket exists.
                s3_status() {
                  local method="$1" endpoint="$2" region="$3" key="$4" secret="$5" bucket="$6"
                  local args=(-sS -o /dev/null -w '%{http_code}' --max-time 30
                              --aws-sigv4 "aws:amz:${region}:s3" --user "${key}:${secret}")
                  [[ "$method" == HEAD ]] && args+=(--head) || args+=(-X "$method")
                  curl "${args[@]}" "${endpoint%/}/${bucket}" || true
                }
                ensure_bucket() {
                  local endpoint="$1" region="$2" key="$3" secret="$4" bucket="$5" code
                  code=$(s3_status HEAD "$endpoint" "$region" "$key" "$secret" "$bucket")
                  if [[ "$code" != 200 ]]; then
                    echo "Creating bucket $bucket at $endpoint (HEAD said $code)..."
                    s3_status PUT "$endpoint" "$region" "$key" "$secret" "$bucket" >/dev/null
                    code=$(s3_status HEAD "$endpoint" "$region" "$key" "$secret" "$bucket")
                  fi
                  if [[ "$code" != 200 ]]; then
                    echo "Error: bucket $bucket at $endpoint is not usable with the supplied key (HTTP $code)."
                    echo "Create it by hand and give the key read/write on it, or allow the key to create buckets."
                    exit 1
                  fi
                  echo "Bucket $bucket is ready."
                }
                write_secret() {
                  local name="$1" key="$2" secret="$3"
                  kubectl create secret generic "$name" -n "$TENANT_NAMESPACE" \
                    --from-literal=accessKey="$key" --from-literal=secretKey="$secret" \
                    --from-literal=accessKeyId="$key" --from-literal=secretAccessKey="$secret" \
                    --dry-run=client -o yaml | kubectl apply -f -
                }

                # A tenant whose "own" bucket is itself a Recovery Point
                # (pod-gateway) keeps it on the backup side here too.
                T_BUCKET="${PREFIX}-${TENANT_NAMESPACE}"
                if [[ "$TENANT_BUCKET_NAMESPACE" == "$GARAGE_BACKUP_NAMESPACE" ]]; then
                  T_ENDPOINT="$B_ENDPOINT"; T_REGION="$B_REGION"; T_KEY="$B_KEY"; T_SECRET="$B_SECRET"
                else
                  T_ENDPOINT="$P_ENDPOINT"; T_REGION="$P_REGION"; T_KEY="$P_KEY"; T_SECRET="$P_SECRET"
                fi
                ensure_bucket "$T_ENDPOINT" "$T_REGION" "$T_KEY" "$T_SECRET" "$T_BUCKET"
                write_secret garage-secret "$T_KEY" "$T_SECRET"
                describe_secret garage-secret "$T_ENDPOINT" "$T_REGION" "$T_BUCKET"

                ensure_bucket "$B_ENDPOINT" "$B_REGION" "$B_KEY" "$B_SECRET" "${PREFIX}-postgres-backups"
                write_secret garage-secret-cnpg "$B_KEY" "$B_SECRET"
                describe_secret garage-secret-cnpg "$B_ENDPOINT" "$B_REGION" "${PREFIX}-postgres-backups"

                # "-backup" keeps it apart from the tenant's own bucket when
                # both sides are one account, where names share a namespace.
                ensure_bucket "$B_ENDPOINT" "$B_REGION" "$B_KEY" "$B_SECRET" "${T_BUCKET}-backup"
                write_secret garage-secret-backup "$B_KEY" "$B_SECRET"
                describe_secret garage-secret-backup "$B_ENDPOINT" "$B_REGION" "${T_BUCKET}-backup"

                echo "External object storage initialized for $TENANT_NAMESPACE."
                exit 0
              fi
              echo "Object storage: in-cluster Garage (no default/$EXTERNAL_SECRET)."

              if [[ "$TENANT_BUCKET_NAMESPACE" == "$GARAGE_BACKUP_NAMESPACE" ]]; then
                TENANT_BUCKET_ENDPOINT="$GARAGE_BACKUP_ENDPOINT"
              else
                TENANT_BUCKET_ENDPOINT="${GARAGE_ENDPOINT:?must give the operational Garage S3 endpoint}"
              fi

              # Wait for an instance to be ready and echo its pod name.
              await_garage() {
                local ns="$1"
                echo "Waiting for Garage in $ns to be ready..." >&2
                until kubectl get pods -n "$ns" -l app.kubernetes.io/name=garage \
                      -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null \
                      | grep -q 'true'; do
                  echo "  $ns not ready yet, waiting..." >&2
                  sleep 5
                done
                kubectl get pods -n "$ns" -l app.kubernetes.io/name=garage -o name | head -n 1
              }

              # Assign a layout on first run. Each instance has its own layout;
              # doing this per instance is why it cannot be hoisted out.
              ensure_layout() {
                local ns="$1" pod="$2"
                local nodes
                nodes=$(kubectl exec -n "$ns" "$pod" -- /garage status \
                        | grep -E '^[0-9a-f]{16}' | awk '{print $1}')
                for node in $nodes; do
                  echo "Staging layout assignment for $node in $ns..."
                  kubectl exec -n "$ns" "$pod" -- /garage layout assign -z dc1 -c 100G "$node" || true
                done
                kubectl exec -n "$ns" "$pod" -- /garage layout apply --version 1 || true
              }

              POD=$(await_garage "$TENANT_BUCKET_NAMESPACE")
              ensure_layout "$TENANT_BUCKET_NAMESPACE" "$POD"

              BACKUP_POD=$(await_garage "$GARAGE_BACKUP_NAMESPACE")
              ensure_layout "$GARAGE_BACKUP_NAMESPACE" "$BACKUP_POD"

              # --- Tenant key & bucket: $TENANT_BUCKET_NAMESPACE ---
              if kubectl get secret garage-secret -n $TENANT_NAMESPACE > /dev/null 2>&1; then
                echo "garage-secret already exists in $TENANT_NAMESPACE namespace, skipping key creation."
              else
                echo "Deleting existing Garage key if any (for idempotent re-runs)..."
                kubectl exec -n $TENANT_BUCKET_NAMESPACE $POD -- /garage key delete --yes ${TENANT_NAMESPACE}-key || true

                echo "Generating access key for $TENANT_NAMESPACE..."
                OUTPUT=$(kubectl exec -n $TENANT_BUCKET_NAMESPACE $POD -- /garage key create ${TENANT_NAMESPACE}-key)

                ACCESS_KEY=$(echo "$OUTPUT" | grep "Key ID:" | awk '{print $3}')
                SECRET_KEY=$(echo "$OUTPUT" | grep "Secret key:" | awk '{print $3}')

                if [[ -z "$ACCESS_KEY" || -z "$SECRET_KEY" ]]; then
                  echo "Error: Failed to parse Key ID or Secret key from output."
                  exit 1
                fi

                echo "Setting permissions for $TENANT_NAMESPACE key..."
                kubectl exec -n $TENANT_BUCKET_NAMESPACE $POD -- /garage key allow ${TENANT_NAMESPACE}-key --create-bucket || true

                echo "Creating $TENANT_NAMESPACE bucket..."
                kubectl exec -n $TENANT_BUCKET_NAMESPACE $POD -- /garage bucket create $TENANT_NAMESPACE || true
                kubectl exec -n $TENANT_BUCKET_NAMESPACE $POD -- /garage bucket allow $TENANT_NAMESPACE --read --write --owner --key ${TENANT_NAMESPACE}-key || true

                echo "Creating garage-secret in $TENANT_NAMESPACE namespace..."
                kubectl create secret generic garage-secret -n $TENANT_NAMESPACE \
                  --from-literal=accessKey="$ACCESS_KEY" \
                  --from-literal=secretKey="$SECRET_KEY" \
                  --from-literal=accessKeyId="$ACCESS_KEY" \
                  --from-literal=secretAccessKey="$SECRET_KEY"
              fi
              describe_secret garage-secret "$TENANT_BUCKET_ENDPOINT" garage "$TENANT_NAMESPACE"

              # --- Dedicated CNPG key: BACKUP instance ---
              # Separate key from the tenant's own, so a compromised app
              # credential cannot reach the backups, and now on separate
              # storage as well.
              echo "Setting up dedicated postgres-backups key for CNPG on $GARAGE_BACKUP_NAMESPACE..."
              kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage key delete --yes ${TENANT_NAMESPACE}-cnpg-key || true
              CNPG_OUTPUT=$(kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage key create ${TENANT_NAMESPACE}-cnpg-key)
              CNPG_ACCESS=$(echo "$CNPG_OUTPUT" | grep "Key ID:" | awk '{print $3}')
              CNPG_SECRET=$(echo "$CNPG_OUTPUT" | grep "Secret key:" | awk '{print $3}')

              if [[ -z "$CNPG_ACCESS" || -z "$CNPG_SECRET" ]]; then
                echo "Error: Failed to parse the CNPG Key ID or Secret key."
                exit 1
              fi

              kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage key allow ${TENANT_NAMESPACE}-cnpg-key --create-bucket || true

              echo "Creating global postgres-backups bucket on the backup instance..."
              kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage bucket create postgres-backups || true
              kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage bucket allow postgres-backups --read --write --owner --key ${TENANT_NAMESPACE}-cnpg-key || true

              # endpointURL travels with the credential so tenants never have to
              # know which instance holds their backups.
              echo "Creating garage-secret-cnpg in $TENANT_NAMESPACE namespace..."
              kubectl create secret generic garage-secret-cnpg -n $TENANT_NAMESPACE \
                --from-literal=accessKeyId="$CNPG_ACCESS" \
                --from-literal=secretAccessKey="$CNPG_SECRET" \
                --from-literal=endpointURL="$GARAGE_BACKUP_ENDPOINT" \
                --dry-run=client -o yaml | kubectl apply -f -
              describe_secret garage-secret-cnpg "$GARAGE_BACKUP_ENDPOINT" garage postgres-backups

              # --- Per-tenant backup bucket & key: BACKUP instance ---
              # Where this tenant's file-shaped backups land: pv-backup-job
              # (PVC -> bucket) and backup-job (bucket -> bucket). A third key
              # rather than reusing either existing one: the tenant's own key
              # lives on the other instance entirely, and garage-secret-cnpg is
              # the postgres operator's, which should not also unlock file
              # backups.
              if kubectl get secret garage-secret-backup -n $TENANT_NAMESPACE > /dev/null 2>&1; then
                echo "garage-secret-backup already exists in $TENANT_NAMESPACE, skipping."
              else
                echo "Setting up the backup bucket and key for $TENANT_NAMESPACE..."
                kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage key delete --yes ${TENANT_NAMESPACE}-backup-key || true
                BK_OUTPUT=$(kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage key create ${TENANT_NAMESPACE}-backup-key)
                BK_ACCESS=$(echo "$BK_OUTPUT" | grep "Key ID:" | awk '{print $3}')
                BK_SECRET=$(echo "$BK_OUTPUT" | grep "Secret key:" | awk '{print $3}')

                if [[ -z "$BK_ACCESS" || -z "$BK_SECRET" ]]; then
                  echo "Error: Failed to parse the backup Key ID or Secret key."
                  exit 1
                fi

                # Same name as the tenant's operational bucket, on the other
                # instance — so a path like nextcloud/pv-backup/html means the
                # same thing on both sides.
                kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage bucket create $TENANT_NAMESPACE || true
                kubectl exec -n $GARAGE_BACKUP_NAMESPACE $BACKUP_POD -- /garage bucket allow $TENANT_NAMESPACE --read --write --owner --key ${TENANT_NAMESPACE}-backup-key || true

                kubectl create secret generic garage-secret-backup -n $TENANT_NAMESPACE \
                  --from-literal=accessKey="$BK_ACCESS" \
                  --from-literal=secretKey="$BK_SECRET" \
                  --from-literal=accessKeyId="$BK_ACCESS" \
                  --from-literal=secretAccessKey="$BK_SECRET" \
                  --from-literal=endpointURL="$GARAGE_BACKUP_ENDPOINT"
              fi
              describe_secret garage-secret-backup "$GARAGE_BACKUP_ENDPOINT" garage "$TENANT_NAMESPACE"

              echo "Garage initialized successfully for $TENANT_NAMESPACE!"
      restartPolicy: OnFailure
