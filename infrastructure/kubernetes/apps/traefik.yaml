apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://helm.traefik.io/traefik'
    targetRevision: "34.5.0"
    chart: traefik
    helm:
      values: |
        ports:
          web:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
          websecure:
            tls:
              enabled: true
            # Traefik v3 gives a request 60s to arrive in full, body included,
            # and answers 504 after that. A video of a few hundred MB does not
            # fit through a home uplink in a minute, so every large upload to
            # Photos or Nextcloud failed at exactly 1m0s while small ones went
            # through. The price is that a slow client may hold a connection
            # for this long; the per-source rate limit still applies.
            transport:
              respondingTimeouts:
                readTimeout: 30m
        ingressRoute:
          dashboard:
            enabled: false
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        service:
          type: LoadBalancer
          # Keep the visitor's address. With the default (Cluster), kube-proxy
          # rewrites the source of everything arriving from outside to a
          # cluster address, so Traefik saw every visitor as 10.42.x: the
          # ipAllowList on the operator interfaces (which admits private
          # ranges) let the whole internet in, and the per-source rate limit
          # was one limit shared by everybody. See doc/hardening.md.
          spec:
            externalTrafficPolicy: Local
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
