apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://helm.traefik.io/traefik'
    targetRevision: "43.0.0"
    chart: traefik
    helm:
      values: |
        # Since chart 39, an entry point's HTTP options (redirections, tls,
        # middlewares) sit under `http`, as in Traefik's own configuration;
        # the chart's schema rejects them one level up.
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            http:
              tls:
                enabled: true
            # Traefik v3 gives a request 60s to arrive in full, body included,
            # and answers 504 after that. A video of a few hundred MB does not
            # fit through a home uplink in a minute, so every large upload to
            # Photos or Nextcloud failed at exactly 1m0s while small ones went
            # through. The price is that a slow client may hold a connection
            # for this long; the per-source rate limit still applies.
            # `operators` and `members` below carry the same timeout: every
            # entrypoint an upload arrives on needs it, and with the Member
            # Network on, members' uploads arrive on `members` alone.
            transport:
              respondingTimeouts:
                readTimeout: 30m
          # The Private Gateway's entrypoint (docs/adr/0066). The LoadBalancer
          # never exposes it: only the ClusterIP Service `traefik-internal`
          # below carries it, and the Private Gateway in the headscale
          # namespace forwards the Private Network's :443 to it. Operator-only
          # routers name `operators` alone, so they cannot be reached through
          # the public entrypoint. Routers that name no entrypoint (most
          # member apps) attach here too, so an operator whose /etc/hosts
          # points at the gateway can still sign in and use the apps.
          operators:
            port: 9443
            exposedPort: 9443
            protocol: TCP
            expose:
              default: false
              internal: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                readTimeout: 30m
          # The Member Gateway's entrypoint (docs/adr/0066), built like
          # `operators`: on `traefik-internal` only, reached from outside the
          # cluster only through the Member Gateway in the member-network
          # namespace, which exists only where the Member Network is on.
          # Routers that name no entrypoint attach here, which is what members
          # get: the full applications. Operator-only routers name `operators`
          # alone and never attach here.
          #
          # Members' devices often reach the gateway only through a DERP
          # relay (2–3 Mbit/s seen on Ring 1), so a photo of 20 MB already
          # takes longer than Traefik's default 60s. Same timeout as
          # `websecure`, for the same reason.
          members:
            port: 9444
            exposedPort: 9444
            protocol: TCP
            expose:
              default: false
              internal: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                readTimeout: 30m
        ingressRoute:
          dashboard:
            enabled: false
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        # Since chart 40, everything that belongs in the Service's spec,
        # its type included, sits under `service.spec`.
        service:
          # Keep the visitor's address. With the default (Cluster), kube-proxy
          # rewrites the source of everything arriving from outside to a
          # cluster address, so Traefik saw every visitor as 10.42.x: the
          # ipAllowList on the operator interfaces (which admits private
          # ranges) let the whole internet in, and the per-source rate limit
          # was one limit shared by everybody. See doc/hardening.md.
          spec:
            type: LoadBalancer
            externalTrafficPolicy: Local
          # Renders as `traefik-internal`, with the ports whose
          # `expose.internal` is true: the `operators` and `members`
          # entrypoints only.
          additionalServices:
            internal:
              spec:
                type: ClusterIP
        # `members` on port 443 at a fixed address, for callers inside the
        # cluster (docs/adr/0066). The CoreDNS override that both bootstrap
        # paths write answers the member applications' hostnames with this
        # address, so Euro-Office and Ring 0's checks Job see the full
        # applications, as members do, while the public entrypoint serves only
        # Guest Paths. The address is in the part of the Service range that
        # Kubernetes keeps for fixed assignments (the first 256 of
        # 10.43.0.0/16), so no Service created before it can hold it. It is
        # also written in infrastructure/cloud-init/k3s-node.yaml.tpl and
        # infrastructure/local/bootstrap-local-node.sh: change all three.
        extraObjects:
          - apiVersion: v1
            kind: Service
            metadata:
              name: traefik-members
              namespace: traefik-system
            spec:
              type: ClusterIP
              clusterIP: 10.43.0.44
              selector:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-traefik-system
              ports:
                - name: https
                  port: 443
                  targetPort: members
                  protocol: TCP
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
