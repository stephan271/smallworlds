# The Barman Cloud CNPG-I plugin (docs/adr/0050). CloudNativePG deprecated its
# in-tree Barman Cloud support in 1.30 and removes it entirely in 1.31.0, so this
# is what produces and reads every database Recovery Point from here on.
#
# Wave -9: after cert-manager and the operator at -10, because the plugin ships
# an Issuer and Certificates of its own and installs into the operator's
# namespace, and before the tenant databases at wave 1 that reference it. A
# Cluster whose plugin is absent does not fail loudly — it simply archives
# nothing — so the ordering is not cosmetic.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
  name: cnpg-barman-plugin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Pinned to an exact release, like every other third-party input here: the
    # plugin signs nothing and a moving tag would change what produces the
    # backups without anybody deciding to.
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/cnpg-barman-plugin
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cnpg-system
  syncPolicy:
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
