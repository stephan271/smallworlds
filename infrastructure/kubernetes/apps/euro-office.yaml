apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # The document server and its shared JWT Secret must exist before the
    # Nextcloud configuration hook selects the Euro-Office connector.
    argocd.argoproj.io/sync-wave: "0"
  name: euro-office
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/euro-office
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nextcloud
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
