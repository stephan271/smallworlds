# Operator Board — docs/adr/0068. Always deployed, Ring 0 included, so Ring 0
# verifies it on every commit. Wave 0: it needs no Keycloak (it has no sign-in
# of its own) and should be up before the applications it watches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: operator-board
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/operator-board
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: operator-board
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
