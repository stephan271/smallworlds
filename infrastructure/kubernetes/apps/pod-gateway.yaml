apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Wave 1: needs Garage (-5), cert-manager and Traefik (-10) already up.
    # No Keycloak dependency — devices authenticate with their own bearer
    # tokens, not OIDC, so this is not a Keycloak relying party.
    argocd.argoproj.io/sync-wave: "1"
  name: pod-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/pod-gateway
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pod-gateway
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
