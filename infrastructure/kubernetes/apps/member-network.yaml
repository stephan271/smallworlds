apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Wave 1: the member Headscale signs devices in against the `smallworlds`
    # realm, so Keycloak (wave 0) has to be up; the Member Gateway forwards to
    # Traefik (-10).
    argocd.argoproj.io/sync-wave: "1"
  name: member-network
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/member-network
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: member-network
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
