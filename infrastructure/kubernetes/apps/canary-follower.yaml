# Ring 0 only (docs/adr/0060). Deliberately NOT listed in
# infrastructure/kubernetes/kustomization.yaml: the Canary overlay adds this
# file to its root, and no other overlay should.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: canary-follower
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: v1.3.0
    path: infrastructure/kubernetes/tenants/canary-follower
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: canary-follower
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
