apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: "87.10.1"
    chart: kube-prometheus-stack
    helm:
      values: |
        # Tier 0 alert suppression (k3s false positives).
        # k3s bundles kube-controller-manager, kube-scheduler and kube-proxy into
        # the single server process and does not expose the per-component metrics
        # endpoints this chart scrapes. The default ServiceMonitors therefore have
        # no endpoints, so up{job=...} is entirely absent and the absent()-based
        # *Down alerts fire as permanent false-positive criticals. Disable both the
        # dead scrape targets (component monitoring) and the corresponding alerting
        # rules. (kube-etcd is left enabled — it does not false-fire here.)
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            # Each of these rule groups contains only the matching *Down alert.
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeProxy: false
        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              # Operator interface (ADR 0038): dashboards expose the shape of
              # the whole cluster and Grafana holds its own admin credential.
              # Middleware lives in apps/monitoring-private-middleware.yaml —
              # it cannot be declared here, since these are Helm values for a
              # chart that renders no Middleware of its own.
              traefik.ingress.kubernetes.io/router.middlewares: monitoring-monitoring-private@kubernetescrd
            hosts:
              - monitoring.smallworlds.network
            tls:
              - secretName: grafana-tls
                hosts:
                  - monitoring.smallworlds.network
          admin:
            existingSecret: "grafana-admin-creds"
            userKey: admin-user
            passwordKey: admin-password
        # Keep the operator itself scheduling-priority high so it can recreate
        # Prometheus/Alertmanager promptly after a disruption.
        prometheusOperator:
          priorityClassName: smallworlds-monitoring
        prometheus:
          prometheusSpec:
            # Evicted last under node pressure (see apps/priorityclasses.yaml):
            # on 2026-08-09 Prometheus and Alertmanager were evicted by the very
            # DiskPressure they should have alerted on, so nothing was reported.
            priorityClassName: smallworlds-monitoring
            # Select monitors/rules cluster-wide instead of only those carrying
            # the chart's release label (the *NilUsesHelmValues defaults).
            # Needed for the CNPG operator-generated PodMonitors, Velero's
            # ServiceMonitor and the backup-alerts PrometheusRule, none of
            # which can carry the Helm release label.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
        alertmanager:
          alertmanagerSpec:
            # Evicted last under node pressure (see apps/priorityclasses.yaml) so
            # alert delivery survives a degrading cluster.
            priorityClassName: smallworlds-monitoring
            # Load AlertmanagerConfig CRs labelled alertmanagerConfig=smallworlds.
            # matcherStrategy None so a single CR in the monitoring namespace routes
            # alerts from ALL namespaces (default OnNamespace would scope it to
            # monitoring only). Routing/receivers live in apps/alertmanager-config.yaml.
            alertmanagerConfigSelector:
              matchLabels:
                alertmanagerConfig: smallworlds
            alertmanagerConfigMatcherStrategy:
              type: None
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
