apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: garage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://datahub-local.github.io/garage-helm'
    # Chart 1.x runs Garage v2.5, a one-way upgrade: do not move this back
    # below 1.0.0 (it would run v2.4 on v2.5 metadata). Fix forward instead.
    # v2.5 also lets only bucket *owners* manage lifecycle rules; every key the
    # init jobs create is already an owner, and nothing here sets lifecycle rules.
    targetRevision: 1.0.0
    chart: garage
    helm:
      values: |
        deployment:
          replicaCount: 1
        garage:
          replicationFactor: "1"
          secret:
            create: false
            name: "garage-auth-secret"
        persistence:
          enabled: true
          # These keys are per-volume. `persistence.size` and
          # `persistence.storageClass` do NOT exist in this chart — Helm
          # ignores unknown values silently, and setting them left Garage on a
          # 1Gi local-path claim while garage-data-pv sat unbound.
          meta:
            size: 1Gi
          data:
            storageClass: static-local
            size: 120Gi
        service:
          s3:
            type: ClusterIP
            port: 3900
          api:
            type: ClusterIP
            port: 3901
          web:
            type: ClusterIP
            port: 3902
        ingress:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: garage-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
