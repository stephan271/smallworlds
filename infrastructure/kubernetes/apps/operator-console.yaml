apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Wave 1, with the tenant applications: the console needs Keycloak for its
    # Console Roles, Traefik for its route, and cert-manager for its certificate.
    # It does not need any of the community applications, and they do not need
    # it — a cluster whose console is down is still a working cluster, which is
    # the property that keeps the console from being a single point of failure.
    argocd.argoproj.io/sync-wave: "1"
  name: operator-console
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/operator-console
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: operator-console
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
