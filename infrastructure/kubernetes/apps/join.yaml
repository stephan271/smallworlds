# Member Invitations — the join page and the Invitation Desk (docs/adr/0058).
# Always deployed, like the dashboard: without it there is no ordinary way to
# get members. Wave 1 because it needs Keycloak (wave 0) — its client job polls
# until Keycloak answers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: join
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephan271/smallworlds.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes/tenants/join
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: join
  syncPolicy:
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
