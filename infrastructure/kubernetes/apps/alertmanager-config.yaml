# Where alerts go (docs/adr/0049: system notification is not mail).
#
# Three AlertmanagerConfigs rather than one. prometheus-operator gives each its
# own top-level route with `continue: true`, so every alert is offered to all
# three, and each is validated on its own: a cluster whose notification Secret
# is missing loses push and heartbeat, but the remediation hand-off keeps
# working, and a broken remediation route cannot silence the operator's phone.
#
# The two outward URLs are secrets — anyone holding an ntfy topic name can read
# the alerts — so they never appear here. The installer plants them as
# `monitoring/smallworlds-notify` (keys `alerts-url`, `heartbeat-url`); on an
# existing cluster the operator creates it once, see doc/alerting.md.
#
# Both endpoints must live outside the cluster: a service that dies with the
# node cannot report the node.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: smallworlds-alerts
  namespace: monitoring
  labels:
    # Matched by kube-prometheus-stack's alertmanagerConfigSelector.
    alertmanagerConfig: smallworlds
  annotations:
    # Apply after the kube-prometheus-stack CRDs exist (fresh-install ordering;
    # ArgoCD retries anyway if the CRD isn't ready yet).
    argocd.argoproj.io/sync-wave: "1"
spec:
  route:
    receiver: push
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      # `none` is Watchdog (handled by smallworlds-heartbeat below) and
      # `info` is InfoInhibitor and friends: both fire continuously by design
      # and would otherwise reach the phone every repeatInterval.
      - receiver: discard
        matchers:
          - name: severity
            matchType: "=~"
            value: "none|info"
  receivers:
    - name: push
      webhookConfigs:
        # An ntfy topic URL ending in `?template=alertmanager`, which makes ntfy
        # render Alertmanager's webhook JSON as a readable title and message.
        - urlSecret:
            name: smallworlds-notify
            key: alerts-url
          sendResolved: true
    - name: discard
---
# Dead man's switch. Watchdog fires for as long as Prometheus and Alertmanager
# are alive; forwarding it every five minutes to an external heartbeat service
# (healthchecks.io) turns *silence* into the alert. Nothing inside the cluster
# can report the cluster's own death — this is the only path that does.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: smallworlds-heartbeat
  namespace: monitoring
  labels:
    alertmanagerConfig: smallworlds
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  route:
    receiver: heartbeat
    matchers:
      - name: alertname
        value: Watchdog
    groupWait: 0s
    groupInterval: 1m
    repeatInterval: 5m
  receivers:
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: smallworlds-notify
            key: heartbeat-url
          sendResolved: false
---
# Tier 1 remediation: hand KubePodCrashLooping to the deterministic handler
# service (which confirms OOMKilled and opens a right-sizing PR). The operator
# still gets the same alert by push through smallworlds-alerts, so nothing is
# hidden while Tier 1 runs in DRY_RUN.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: smallworlds-remediation
  namespace: monitoring
  labels:
    alertmanagerConfig: smallworlds
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  route:
    receiver: tier1-webhook
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: alertname
        value: KubePodCrashLooping
  receivers:
    - name: tier1-webhook
      webhookConfigs:
        - url: http://remediation.remediation.svc.cluster.local:8080/webhook
          sendResolved: true
