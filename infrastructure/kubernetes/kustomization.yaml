apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is the master base for SmallWorlds communities.
# It includes the core backend components (via ArgoCD App CRDs) 
# and the user-facing tenants (via Kustomize bases) so they can be easily patched.
resources:
  - namespaces.yaml

  # 1. Backend Components (Installed as ArgoCD Apps)
  - apps/cert-manager.yaml
  - apps/cert-manager-webhook-hetzner.yaml
  - apps/cloudnative-pg.yaml
  - apps/cnpg-barman-plugin.yaml
  - apps/argocd-ingress.yaml
  - apps/garage.yaml
  - apps/garage-backup.yaml
  - apps/persistent-storage.yaml
  - apps/traefik.yaml
  - apps/kube-prometheus-stack.yaml
  - apps/monitoring-private-middleware.yaml
  - apps/loki-stack.yaml
  - apps/velero.yaml
  - apps/backup-replicator.yaml
  - apps/pod-archive-alerts.yaml
  - apps/alertmanager-config.yaml
  - apps/priorityclasses.yaml
  - apps/backup-alerts.yaml
  - apps/update-alerts.yaml
  - apps/node-disk-alerts.yaml
  # No trivy-operator and no in-cluster Renovate (2026-11-09). Version-bump PRs
  # come from the Renovate GitHub App (renovate.json); nothing read Trivy's
  # reports, and its scans competed with the members' applications for the one
  # node. Image scanning, if it returns, belongs in CI before a tag.
  - apps/headscale.yaml
  # 2. Core Frontend Services
  - apps/dashboard.yaml
  - apps/keycloak.yaml
  - apps/join.yaml
  # Stalwart is NOT here: mail is an opt-in capability (docs/adr/0049). Nothing
  # in the cluster requires it — onboarding hands out action-token links out of
  # band and alerting pushes over HTTP — so a community that does not want to
  # run a mail server does not get one. Overlays that do select it add
  # apps/stalwart.yaml themselves, like any other optional app.

  # 3. The Operator Console was deactivated on 2026-08-23 and deleted on
  # 2026-11-12 (docs/adr/0062); the setup wizard in admin-tools/setup-wizard/
  # installs instead. A cluster still running it loses it when it adopts a
  # release from v1.2.44 on: the root app prunes the Application.
  
  # Note: Optional apps (forgejo, immich, nextcloud, bulwark, excalidraw) 
  # are dynamically added to your private kustomization.yaml by prepare-community-repo.sh

