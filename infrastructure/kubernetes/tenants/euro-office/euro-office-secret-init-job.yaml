apiVersion: v1
kind: ServiceAccount
metadata:
  name: euro-office-secret-init
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: euro-office-secret-init
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: euro-office-secret-init
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: euro-office-secret-init
    namespace: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: euro-office-secret-init
---
apiVersion: batch/v1
kind: Job
metadata:
  name: euro-office-secret-init
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: euro-office-secret-init
      containers:
        - name: secret-gen
          image: docker.io/alpine/k8s:1.36.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              if ! kubectl get secret euro-office-jwt -n nextcloud >/dev/null 2>&1; then
                echo "Generating the shared Euro-Office JWT secret..."
                JWT_SECRET=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 64)
                kubectl create secret generic euro-office-jwt -n nextcloud \
                  --from-literal=jwt-secret="$JWT_SECRET"
              else
                echo "euro-office-jwt already exists, preserving it."
              fi
      restartPolicy: OnFailure
