apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        app: keycloak-realm-config
    spec:
      containers:
        - name: kcadm
          image: quay.io/keycloak/keycloak:26.6.4
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: admin-password
            - name: BULK_INVITE_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: bulk-invite-secret
            # Password for the human master-realm administrator (see below).
            # Optional so a cluster provisioned before this key existed still
            # syncs; the operator account is then simply not created.
            - name: KEYCLOAK_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: operator-password
                  optional: true
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-stalwart-secret
                  key: password
                  optional: true
            - name: ONBOARDING_MODE
              value: "invitation"
            # Public identity host baked into the realm import (WebAuthn RP ID).
            # Overridden per-environment by the overlay's domain patches so dev
            # gets identity.dev.<domain> instead of the base host — see
            # admin-tools/generate_domain_patches.py (keycloak block).
            - name: IDENTITY_HOST
              value: "identity.smallworlds.network"
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Keycloak to be ready..."
              until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak-keycloakx-http:80 --realm master --user admin --password "$KEYCLOAK_ADMIN_PASSWORD" > /dev/null 2>&1; do
                echo "Keycloak is not ready, waiting..."
                sleep 3
              done
              
              echo "Importing smallworlds realm..."
              sed -e "s/\${env.STALWART_PASSWORD}/$STALWART_PASSWORD/g" \
                  -e "s/\${env.IDENTITY_HOST}/$IDENTITY_HOST/g" \
                  /opt/keycloak/data/realm-config/smallworlds-realm.json > /tmp/realm-configured.json
              /opt/keycloak/bin/kcadm.sh create realms -f /tmp/realm-configured.json || echo "Realm may already exist."

              echo "Setting onboarding mode to $ONBOARDING_MODE..."
              if [ "$ONBOARDING_MODE" = "self-registration" ]; then
                /opt/keycloak/bin/kcadm.sh update realms/smallworlds -s registrationAllowed=true -s verifyEmail=true
              else
                /opt/keycloak/bin/kcadm.sh update realms/smallworlds -s registrationAllowed=false
              fi

              # A human administrator with a second factor, kept separate from
              # `admin`. TOTP cannot be required of `admin` itself: that account
              # authenticates by password grant for bases/keycloak-client-job
              # (every tenant's OIDC registration), console-roles-job and this
              # job, and a pending required action makes direct grant fail with
              # "Account is not fully set up" — which would break the OIDC wiring
              # of the whole cluster on the next sync. So `admin` stays the
              # automation and break-glass credential, reachable only from the
              # Private Network now that /admin is address-restricted, and people
              # log in as `operator`.
              #
              # Master's stock browser flow already carries a conditional OTP
              # subflow, so no flow surgery is needed: once CONFIGURE_TOTP is
              # satisfied, OTP is demanded at every login. The create is guarded
              # rather than idempotent-by-update, because re-adding the required
              # action on each sync would force the operator to re-enrol their
              # authenticator every time ArgoCD reconciles.
              if [ -n "$KEYCLOAK_OPERATOR_PASSWORD" ]; then
                if /opt/keycloak/bin/kcadm.sh get users -r master -q username=operator --fields username 2>/dev/null | grep -q '"operator"'; then
                  echo "Master operator account already exists — leaving its credentials alone."
                else
                  echo "Creating master-realm operator account (password + TOTP)..."
                  /opt/keycloak/bin/kcadm.sh create users -r master \
                    -s username=operator -s enabled=true \
                    -s 'requiredActions=["CONFIGURE_TOTP"]' \
                    && /opt/keycloak/bin/kcadm.sh set-password -r master --username operator \
                         --new-password "$KEYCLOAK_OPERATOR_PASSWORD" \
                    && /opt/keycloak/bin/kcadm.sh add-roles -r master --uusername operator --rolename admin \
                    && echo "Operator account created; TOTP is enrolled at first login." \
                    || echo "WARNING: operator account setup incomplete — check the log above."
                fi
              else
                echo "No operator-password in keycloak-admin-creds — skipping the human admin account."
              fi

              echo "Creating bulk-invite service account client..."
              /opt/keycloak/bin/kcadm.sh create clients -r smallworlds -s clientId=bulk-invite -s serviceAccountsEnabled=true -s publicClient=false -s secret="$BULK_INVITE_SECRET" || echo "Client may already exist."
              
              echo "Assigning realm-admin role to bulk-invite..."
              /opt/keycloak/bin/kcadm.sh add-roles -r smallworlds --uusername service-account-bulk-invite --cclientid realm-management --rolename realm-admin || echo "Role may already be assigned."

              echo "Realm configuration complete."
          volumeMounts:
            - name: realm-config
              mountPath: "/opt/keycloak/data/realm-config/smallworlds-realm.json"
              subPath: "smallworlds-realm.json"
              readOnly: true
      restartPolicy: OnFailure
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
  backoffLimit: 10
