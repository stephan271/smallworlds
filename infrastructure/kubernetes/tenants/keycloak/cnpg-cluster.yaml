# Deploy an isolated, highly-available PostgreSQL cluster specifically for Keycloak using the CloudNativePG Operator
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 2
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.4-v0.3.0
  primaryUpdateStrategy: unsupervised
  # The signing region now lives on the ObjectStore, not here: the plugin runs
  # barman in a sidecar, which does not inherit the Cluster's env.
  monitoring:
    enablePodMonitor: true
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  # Destination, retention and region all live on the ObjectStore in
  # objectstore.yaml (docs/adr/0050).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups-keycloak
---
# Daily scheduled backup at 03:00 UTC (staggered from Nextcloud/Immich)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-backup
  namespace: keycloak
spec:
  # SIX fields, seconds first — CNPG is not Kubernetes CronJob syntax.
  # A five-field "0 3 * * *" parses as second 0 of minute 3 of EVERY hour.
  schedule: "0 0 3 * * *"
  # Without these the schedule fires but takes nothing: the default method is the
  # in-tree object store, which this cluster no longer configures.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: keycloak-db
  immediate: true
  backupOwnerReference: self
