# Deploy an isolated, highly-available PostgreSQL cluster specifically for Keycloak using the CloudNativePG Operator
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 2
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.4-v0.3.0
  primaryUpdateStrategy: unsupervised
  # Garage's [s3_api] s3_region is "garage". Without this, barman-cloud (and any S3
  # client) signs SigV4 with the default us-east-1 scope, which Garage rejects with
  # HTTP 400 (AuthorizationHeaderMalformed). That silently stalls WAL archiving and
  # lets pg_wal grow until the node's disk fills — see doc/storage-and-backup.md.
  env:
    - name: AWS_REGION
      value: garage
    - name: AWS_DEFAULT_REGION
      value: garage
  monitoring:
    enablePodMonitor: true
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://postgres-backups-keycloak/
      endpointURL: http://garage.garage-system.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: garage-secret
          key: accessKeyId
        secretAccessKey:
          name: garage-secret
          key: secretAccessKey
      wal:
        compression: gzip
---
# Daily scheduled backup at 03:00 UTC (staggered from Nextcloud/Immich)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-backup
  namespace: keycloak
spec:
  schedule: "0 3 * * *"
  cluster:
    name: keycloak-db
  immediate: true
  backupOwnerReference: self
