apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - objectstore.yaml
  - cnpg-cluster.yaml
  - keycloak-admin-ingress.yaml
  - keycloak-redirect.yaml
  - realm-config-job.yaml
  - setup-rbac.yaml
  - garage-init-job.yaml
  - ../../bases/edge-protection
  - ../../bases/db-network-policy

configMapGenerator:
  - name: keycloak-realm-config
    files:
      - smallworlds-realm.json
  - name: keycloak-spi-config
    files:
      - action-token-generator.jar

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: NetworkPolicy
      name: database-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels/cnpg.io~1cluster
        value: keycloak-db
      # The one legitimate cross-namespace database dependency in the cluster:
      # stalwart's mail-provisioner reads the Keycloak database directly to
      # discover new users (doc/tenant-stalwart.md). Without this the mailbox
      # sync stops, and it stops quietly.
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: stalwart
  - target:
      kind: ClusterRoleBinding
      name: setup-binding
    patch: |-
      - op: replace
        path: /metadata/name
        value: setup-binding-keycloak

helmCharts:
  - name: keycloakx
    repo: https://codecentric.github.io/helm-charts
    releaseName: keycloak
    version: 7.2.0
    valuesFile: values.yaml
