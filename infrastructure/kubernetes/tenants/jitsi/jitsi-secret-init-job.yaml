apiVersion: batch/v1
kind: Job
metadata:
  name: jitsi-secret-init
  namespace: jitsi
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: setup-sa
      containers:
        - name: secret-gen
          image: docker.io/alpine/k8s:1.36.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              if ! kubectl get secret jitsi-jwt -n jitsi >/dev/null 2>&1; then
                echo "Generating Jitsi JWT app secret..."
                JWT_SECRET=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)

                kubectl create secret generic jitsi-jwt -n jitsi \
                  --from-literal=JWT_APP_SECRET="$JWT_SECRET"
              else
                echo "jitsi-jwt already exists, skipping."
              fi

              # XMPP passwords for jicofo and jvb (values.yaml says why they are
              # not left to the chart). Made once; an existing cluster keeps the
              # passwords its chart-made Secrets already hold, so Prosody's
              # accounts still match while the pods move over.
              keep_or_new() {  # <chart secret> <key>
                local current
                current=$(kubectl get secret "$1" -n jitsi -o "jsonpath={.data.$2}" 2>/dev/null | base64 -d 2>/dev/null || true)
                if [ -n "$current" ]; then printf '%s' "$current"; else tr -dc A-Za-z0-9 </dev/urandom | head -c 24; fi
              }
              if ! kubectl get secret jitsi-jicofo-auth -n jitsi >/dev/null 2>&1; then
                kubectl create secret generic jitsi-jicofo-auth -n jitsi \
                  --from-literal=JICOFO_AUTH_PASSWORD="$(keep_or_new jitsi-jitsi-meet-jicofo-secret JICOFO_AUTH_PASSWORD)"
              else
                echo "jitsi-jicofo-auth already exists, skipping."
              fi
              if ! kubectl get secret jitsi-jvb-auth -n jitsi >/dev/null 2>&1; then
                kubectl create secret generic jitsi-jvb-auth -n jitsi \
                  --from-literal=JVB_AUTH_USER=jvb \
                  --from-literal=JVB_AUTH_PASSWORD="$(keep_or_new jitsi-jitsi-meet-jvb-secret JVB_AUTH_PASSWORD)"
              else
                echo "jitsi-jvb-auth already exists, skipping."
              fi
      restartPolicy: OnFailure
