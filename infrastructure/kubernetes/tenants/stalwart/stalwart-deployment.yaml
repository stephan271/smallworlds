apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: stalwart
data:
  config.json: |
    {
      "@type": "PostgreSql",
      "host": "database-rw.stalwart.svc.cluster.local",
      "database": "app",
      "port": 5432,
      "authUsername": "app",
      "authSecret": {
        "@type": "EnvironmentVariable",
        "variableName": "DB_PASSWORD"
      },
      "useTls": false,
      "allowInvalidCerts": false,
      "timeout": 15000,
      "poolMaxConnections": 10
    }
  relay.json: |
    {
      "server": {
        "listener": {
          "smtp": {
            "relay": {
              "networks": ["127.0.0.1/8", "::1", "10.42.0.0/16", "10.43.0.0/16"]
            }
          }
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-mail
  namespace: stalwart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart-mail
  template:
    metadata:
      labels:
        app: stalwart-mail
    spec:
      containers:
        - name: stalwart
          # Upgrading? Move SPAM_RULES_URL in stalwart-init-job.yaml to the
          # spam-filter release made for the new version in the same change:
          # rules this version cannot parse stop every settings reload.
          image: stalwartlabs/stalwart:v0.16.27@sha256:2c9af6bfccb361b9f286d6cd0bb50acb2aaeffc06f5257354c0ce4dff9f02b58
          ports:
            - containerPort: 25
              name: smtp
            - containerPort: 465
              name: submissions
            - containerPort: 143
              name: imap
            - containerPort: 993
              name: imaps
            - containerPort: 8080
              name: jmap
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: password
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-admin-secret
                  key: recovery-admin
                  optional: true
            - name: DOMAIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-dns-secrets
                  key: DOMAIN
            # ".dev" on the dev cluster, "" on production — the hostname must
            # match the server's PTR record (mail.dev.<domain> vs mail.<domain>)
            - name: ENV_EXT
              valueFrom:
                secretKeyRef:
                  name: stalwart-dns-secrets
                  key: ENV_EXT
            # Stalwart v0.16 takes its settings from its own registry, not from
            # STALWART_* variables: on Ring 0 (2026-11-10) the hostname, the
            # certificate and a submission listener on 587 set here were all
            # ignored. The hostname is set by stalwart-init-job.yaml and the
            # certificate by stalwart-tls-sync.yaml; mail apps submit on 465.
            - name: STALWART_SERVER_HOSTNAME
              value: "mail$(ENV_EXT).$(DOMAIN)"
            - name: STALWART_MTA_OUTBOUND_STRATEGY_DEFAULT_EHLO
              value: "mail$(ENV_EXT).$(DOMAIN)"
            - name: STALWART_SESSION_RCPT_ALLOW_RELAYING
              value: "!is_empty(authenticated_as) || starts_with(remote_ip, '10.42.') || starts_with(remote_ip, '10.43.')"
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
            - name: config
              mountPath: /etc/stalwart/relay.json
              subPath: relay.json
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: tls
          secret:
            secretName: stalwart-tls

---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: stalwart
spec:
  type: LoadBalancer
  selector:
    app: stalwart-mail
  ports:
    - name: smtp
      port: 25
      targetPort: 25
    - name: submissions
      port: 465
      targetPort: 465
    - name: imaps
      port: 993
      targetPort: 993
    - name: jmap
      port: 8080
      targetPort: 8080
