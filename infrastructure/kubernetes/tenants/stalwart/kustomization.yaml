apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stalwart

bases:
  - ../../bases/setup-rbac
  - ../../bases/garage-init-job

resources:
  - cnpg-cluster.yaml
  - stalwart-deployment.yaml
  - stalwart-init-job.yaml
  - mail-provisioner-deployment.yaml
  - mail-provisioner-rbac.yaml
  - stalwart-ingress.yaml
  - stalwart-cors-middleware.yaml
  - stalwart-secret-init-job.yaml
  - ../../bases/db-network-policy

patches:
  - target:
      kind: NetworkPolicy
      name: database-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels/cnpg.io~1cluster
        value: database
  - target:
      kind: ClusterRoleBinding
      name: setup-binding
    patch: |-
      - op: replace
        path: /metadata/name
        value: setup-binding-stalwart
