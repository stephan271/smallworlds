apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stalwart

bases:
  - ../../bases/setup-rbac
  - ../../bases/garage-init-job

resources:
  - ../../bases/pre-update-backup
  - objectstore.yaml
  - cnpg-cluster.yaml
  - stalwart-deployment.yaml
  - stalwart-init-job.yaml
  - stalwart-tls-sync.yaml
  - mail-provisioner-deployment.yaml
  - mail-provisioner-rbac.yaml
  - stalwart-ingress.yaml
  - stalwart-cors-middleware.yaml
  - stalwart-secret-init-job.yaml
  - ../../bases/db-network-policy

patches:
  - target:
      kind: Job
      name: pre-update-backup
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: pre-update-backup
      spec:
        template:
          spec:
            containers:
              - name: backup
                env:
                  - name: WORKLOAD
                    value: deployment/stalwart-mail
                  - name: CONTAINER
                    value: stalwart
  - target:
      kind: NetworkPolicy
      name: database-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels/cnpg.io~1cluster
        value: database
  - target:
      kind: ClusterRoleBinding
      name: setup-binding
    patch: |-
      - op: replace
        path: /metadata/name
        value: setup-binding-stalwart

replacements:
  # The image the update brings, for the pre-update backup (bases/pre-update-backup).
  - source:
      kind: Deployment
      name: stalwart-mail
      fieldPath: spec.template.spec.containers.[name=stalwart].image
    targets:
      - select:
          kind: Job
          name: pre-update-backup
        fieldPaths:
          - spec.template.spec.containers.[name=backup].env.[name=DESIRED_IMAGE].value
  - source:
      kind: Cluster
      name: database
      fieldPath: spec.imageName
    targets:
      - select:
          kind: Job
          name: pre-update-backup
        fieldPaths:
          - spec.template.spec.containers.[name=backup].env.[name=DESIRED_DB_IMAGE].value
