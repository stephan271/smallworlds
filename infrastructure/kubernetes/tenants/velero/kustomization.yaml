apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: velero

helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 12.2.4
    releaseName: velero
    namespace: velero
    includeCRDs: true
    valuesInline:
      initContainers:
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /target
              name: plugins
      upgradeCRDs: true
      configuration:
        backupStorageLocation:
          - name: default
            provider: aws
            bucket: velero-backups
            config:
              # Must match Garage's [s3_api] s3_region ("garage"); the AWS default
              # us-east-1 makes Garage reject every request with HTTP 400
              # (AuthorizationHeaderMalformed). Same root cause as the CNPG clusters.
              region: garage
              s3ForcePathStyle: true
              s3Url: http://garage-backup.garage-backup-system.svc.cluster.local:3900
        volumeSnapshotLocation: []
      credentials:
        existingSecret: velero-s3-creds
      metrics:
        enabled: true
        serviceMonitor:
          # Scraped cluster-wide (serviceMonitorSelectorNilUsesHelmValues is
          # relaxed in apps/kube-prometheus-stack.yaml); feeds the
          # VeleroBackupStale alert in apps/backup-alerts.yaml.
          enabled: true
          # autodetect gates rendering on .Capabilities.APIVersions, which is
          # empty under Kustomize's `helm template` inflation — the
          # ServiceMonitor would silently never render. ArgoCD retries cover
          # the fresh-install window before the CRD exists.
          autodetect: false
      schedules:
        daily-cluster-state:
          schedule: "0 2 * * *"
          template:
            excludedNamespaces:
              - kube-system
            ttl: 720h
      deployNodeAgent: false

resources:
  - ../../bases/setup-rbac
  - ../../bases/velero-garage-init-job

patches:
  - target:
      kind: ClusterRoleBinding
      name: setup-binding
    patch: |-
      - op: replace
        path: /metadata/name
        value: setup-binding-velero
