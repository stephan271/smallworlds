apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo

bases:
  - ../../bases/setup-rbac
  - ../../bases/garage-init-job
  - ../../bases/keycloak-client-job
  - ../../bases/pv-backup-job

resources:
  - ../../bases/pre-update-backup
  - redis.yaml
  - objectstore.yaml
  - cnpg-cluster.yaml
  - oidc-config-job.yaml
  - forgejo-secret-init-job.yaml
  - ../../bases/edge-protection
  - ../../bases/db-network-policy

patches:
  - target:
      kind: Job
      name: pre-update-backup
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: pre-update-backup
      spec:
        template:
          spec:
            containers:
              - name: backup
                env:
                  - name: WORKLOAD
                    value: deployment/forgejo
                  - name: CONTAINER
                    value: forgejo
  - target:
      kind: NetworkPolicy
      name: database-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels/cnpg.io~1cluster
        value: database
  - target:
      kind: ClusterRoleBinding
      name: setup-binding
    patch: |-
      - op: replace
        path: /metadata/name
        value: setup-binding-forgejo
  # Nightly copy of the git repositories (the S3 storage config only covers
  # LFS/attachments/avatars — bare repos live on this PVC). Staggered after
  # Immich's 00:30 run to be kind to the shared disk.
  - target:
      kind: CronJob
      name: pv-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "45 0 * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: gitea-shared-storage
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/0/value
        value: "forgejo/pv-backup/data"
  - target:
      kind: Job
      name: keycloak-client-init
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: REDIRECT_URIS
            value: '["https://git.smallworlds.network/user/oauth2/smallworlds/callback"]'

helmCharts:
  - name: forgejo
    # The chart's own registry. codeberg.org/forgejo-contrib mirrors it, and its
    # registry refused every pull with 403 "under load" for hours on 2026-11-12.
    repo: oci://code.forgejo.org/forgejo-helm
    releaseName: forgejo
    version: 17.1.1
    valuesFile: values.yaml

replacements:
  # The image the update brings, for the pre-update backup (bases/pre-update-backup).
  - source:
      kind: Deployment
      name: forgejo
      fieldPath: spec.template.spec.containers.[name=forgejo].image
    targets:
      - select:
          kind: Job
          name: pre-update-backup
        fieldPaths:
          - spec.template.spec.containers.[name=backup].env.[name=DESIRED_IMAGE].value
  - source:
      kind: Cluster
      name: database
      fieldPath: spec.imageName
    targets:
      - select:
          kind: Job
          name: pre-update-backup
        fieldPaths:
          - spec.template.spec.containers.[name=backup].env.[name=DESIRED_DB_IMAGE].value
