apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-secret-init
  namespace: forgejo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: setup-sa
      containers:
        - name: secret-gen
          image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              if ! kubectl get secret forgejo-admin-creds -n forgejo >/dev/null 2>&1; then
                echo "Generating Forgejo password..."
                PASSWORD=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)
                
                kubectl create secret generic forgejo-admin-creds -n forgejo \
                  --from-literal=username="forgejo_admin" \
                  --from-literal=password="$PASSWORD"
              else
                echo "forgejo-admin-creds already exists, skipping."
              fi
      restartPolicy: OnFailure
