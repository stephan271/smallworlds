apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  # The signing region now lives on the ObjectStore, not here: the plugin runs
  # barman in a sidecar, which does not inherit the Cluster's env.
  monitoring:
    enablePodMonitor: true
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  # Destination, retention and region all live on the ObjectStore in
  # objectstore.yaml (docs/adr/0050).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: database-backup
spec:
  # SIX fields, seconds first — CNPG is not Kubernetes CronJob syntax.
  # A five-field "0 2 * * *" parses as second 0 of minute 2 of EVERY hour.
  schedule: "0 0 2 * * *"
  # Without these the schedule fires but takes nothing: the default method is the
  # in-tree object store, which this cluster no longer configures.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: database
  immediate: true
  backupOwnerReference: self
