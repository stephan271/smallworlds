# Provisions the read-only database identity the pod exporter uses.
#
# Deliberately two jobs at opposite ends of the sync, because the two halves
# have opposite ordering requirements:
#
#   - The password Secret must exist EARLY. The CNPG `managed` role in
#     cnpg-cluster.yaml references it, and CNPG retries role reconciliation
#     until it appears.
#   - The GRANTs can only run LATE. Only the `app` owner can grant SELECT on
#     Immich's tables (CNPG's app user is not a superuser and cannot CREATE
#     ROLE), and that means waiting for the cluster to have bootstrapped.
#
# Doing both in one Sync hook deadlocks: the hook blocks the sync that would
# have created the CNPG Cluster it is waiting for, and the whole tenant never
# deploys.
apiVersion: batch/v1
kind: Job
metadata:
  name: pod-export-secret-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # Alongside the other early init jobs, after setup-rbac (-3).
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: setup-sa
      restartPolicy: OnFailure
      containers:
        - name: password
          image: docker.io/alpine/k8s:1.36.2
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if kubectl get secret immich-pod-exporter-db -n immich >/dev/null 2>&1; then
                echo "immich-pod-exporter-db already exists, keeping it."
                exit 0
              fi
              echo "Generating pod_exporter password..."
              PASSWORD=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
              kubectl create secret generic immich-pod-exporter-db -n immich \
                --type=kubernetes.io/basic-auth \
                --from-literal=username=pod_exporter \
                --from-literal=password="$PASSWORD"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pod-export-grants
  annotations:
    # PostSync: runs only once the CNPG Cluster is applied and healthy, so
    # `database-app` exists. Grants are idempotent, so re-running on every sync
    # is harmless.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: setup-sa
      restartPolicy: OnFailure
      containers:
        - name: grants
          image: docker.io/postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGPASSWORD="$APP_PASSWORD"
              PSQL="psql -h database-rw -U app -d app -v ON_ERROR_STOP=1"

              echo "Waiting for CNPG to create the pod_exporter role..."
              for _ in $(seq 1 60); do
                if $PSQL -At -c "SELECT 1 FROM pg_roles WHERE rolname='pod_exporter'" \
                     2>/dev/null | grep -q 1; then
                  break
                fi
                echo "  role not present yet, waiting..."
                sleep 10
              done

              echo "Granting read-only access on the Immich schema..."
              $PSQL <<'SQL'
              GRANT CONNECT ON DATABASE app TO pod_exporter;
              GRANT USAGE ON SCHEMA public TO pod_exporter;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO pod_exporter;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public
                GRANT SELECT ON TABLES TO pod_exporter;
              SQL
              echo "pod_exporter is ready (SELECT only)."
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: password
