apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich

bases:
  - ../../bases/setup-rbac
  - ../../bases/garage-init-job
  - ../../bases/keycloak-client-job

resources:
  - redis.yaml
  - cnpg-cluster.yaml
  - admin-config.yaml
  - admin-init-job.yaml
  - immich-secret-init-job.yaml
  - library-pvc.yaml
  - immich-catalog.yaml
  - pod-export-db-init-job.yaml
  - pod-export-cronjob.yaml
  - ../../bases/edge-protection

patches:
  - target:
      kind: ClusterRoleBinding
      name: setup-binding
    patch: |-
      - op: replace
        path: /metadata/name
        value: setup-binding-immich
  # The originals are no longer mirrored into the tenant bucket by pv-backup.
  # immich-pod-export appends them to each enrolled user's pod instead, and that
  # archive is deliberately the only server-side copy — docs/adr/0047.
  - target:
      kind: Job
      name: keycloak-client-init
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: REDIRECT_URIS
            value: '["https://photos.smallworlds.network/auth/login", "https://photos.smallworlds.network/user-settings", "app.immich:///"]'
  - target:
      kind: Cluster
      name: database
    patch: |-
      - op: remove
        path: /spec/imageName
      - op: add
        path: /spec/imageCatalogRef
        value:
          apiGroup: postgresql.cnpg.io
          kind: ClusterImageCatalog
          name: immich-catalog
          major: 16
      # postInitApplicationSQL, not postInitSQL: the extensions must exist in
      # the app database Immich connects to, not the postgres maintenance DB
      - op: add
        path: /spec/bootstrap/initdb/postInitApplicationSQL
        value:
          - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
          - CREATE EXTENSION IF NOT EXISTS cube;
          - CREATE EXTENSION IF NOT EXISTS earthdistance;
      - op: add
        path: /spec/postgresql
        value:
          shared_preload_libraries:
            - "vchord.so"
      # Login role for the pod exporter. CNPG owns the role's existence; the
      # SELECT grants are applied by pod-export-db-init, which connects as the
      # `app` owner.
      - op: add
        path: /spec/managed
        value:
          roles:
            - name: pod_exporter
              ensure: present
              login: true
              passwordSecret:
                name: immich-pod-exporter-db

configMapGenerator:
  - name: immich-pod-export-sql
    namespace: immich
    files:
      - pod-export/inventory.sql
  - name: immich-pod-export-src
    namespace: immich
    files:
      - pod-export/export.py

helmCharts:
  - name: immich
    # The HTTP helm repo was removed with chart 0.13; OCI only
    repo: oci://ghcr.io/immich-app/immich-charts
    releaseName: immich
    version: 0.13.1
    valuesFile: values.yaml
