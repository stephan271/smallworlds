apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limit + baseline security headers (bases/edge-protection).
    traefik.ingress.kubernetes.io/router.middlewares: dashboard-edge-ratelimit@kubernetescrd,dashboard-edge-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dashboard.smallworlds.network
      secretName: dashboard-tls
  rules:
    - host: dashboard.smallworlds.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
