apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: collabora
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabora
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
        - name: collabora
          image: collabora/code:26.04.6.2.1@sha256:a2f5d4e88addd46033d8440f7a13b82f7e6fe444bf8c6b5a3eadc789f0b5342b
          ports:
            - containerPort: 9980
          env:
            - name: aliasgroup1
              value: "https://files.smallworlds.network,https://files.smallworlds.network:443"
            - name: server_name
              value: "office.smallworlds.network"
            - name: extra_params
              value: "--disable-cool-user-checking --o:ssl.enable=false --o:ssl.termination=true --o:security.capabilities=false"
            - name: dictionaries
              value: "en_US"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: nextcloud
spec:
  selector:
    app.kubernetes.io/name: collabora
  ports:
    - protocol: TCP
      port: 9980
      targetPort: 9980
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora
  namespace: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Collabora inherits Nextcloud's exposure: a non-member opening a shared
    # document loads the editor from here. It reuses the nextcloud namespace's
    # edge-protection middlewares rather than declaring its own, since both
    # live in that namespace and duplicate names would collide between the two
    # Applications. Collabora is useless without Nextcloud anyway; if it syncs
    # first the route 404s until Nextcloud creates them.
    traefik.ingress.kubernetes.io/router.middlewares: nextcloud-edge-ratelimit@kubernetescrd,nextcloud-edge-headers@kubernetescrd
    # No dashboard tile: the dashboard is open to everyone, and this is the
    # editor behind Nextcloud's Office integration: members open documents from
    # Files, and this address alone shows only the server's landing page.
    gethomepage.dev/enabled: "false"
spec:
  rules:
    - host: office.smallworlds.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora
                port:
                  number: 9980
  tls:
    - hosts:
        - office.smallworlds.network
      secretName: collabora-tls
