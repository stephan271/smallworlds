apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # No dashboard tile: the dashboard is open to everyone, and this is the
    # Operator tailnet's control server: Tailscale clients use it, a browser
    # gets nothing.
    gethomepage.dev/enabled: "false"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vpn.smallworlds.network
      secretName: headscale-tls
  rules:
    - host: vpn.smallworlds.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 80
