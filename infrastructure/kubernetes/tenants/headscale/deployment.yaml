apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
spec:
  replicas: 1
  strategy:
    # SQLite on a ReadWriteOnce PVC — a rolling update briefly running two
    # pods against the same file would corrupt it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
    spec:
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          env:
            # Headscale reads every config key from the environment too
            # (viper, prefix HEADSCALE_, dots as underscores). The public
            # address lives here rather than in the ConfigMap so an overlay can
            # move it onto the operator's own domain with a one-value patch
            # instead of rewriting the whole embedded config file.
            - name: HEADSCALE_SERVER_URL
              value: https://vpn.smallworlds.network
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/headscale
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
