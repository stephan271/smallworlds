# Ring 0's storage checks (checks/storage-checks.sh), as a template only, like
# checks-job.yaml: suspended and scheduled never; the Canary Follower cuts one
# Job per commit after the e2e and data checks (STORAGE_CHECKS_CRONJOB) and
# waits for it. By hand:
#
#   kubectl -n canary-follower create job --from=cronjob/canary-storage-checks by-hand-$(date +%s)
#
# Ring 0 keeps Garage and the replicator running, unused, beside its external
# provider (overlay generated with --keep-garage), so that their updates can be
# verified (design-update-strategy §3.2). This Job is their only user.
#
# Its Roles live in namespaces the Garage and replicator Applications create, so
# this tenant needs those Applications deployed first: --keep-garage before it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: canary-storage-checks
  namespace: canary-follower
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app: canary-storage-checks
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app: canary-storage-checks
        spec:
          restartPolicy: Never
          serviceAccountName: canary-storage-checks
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: checks
              # kubectl, jq, bash and the AWS CLI; the image the init jobs use.
              image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              command: ["bash", "/scripts/storage-checks.sh"]
              env:
                - name: HOME
                  value: /tmp
                - name: WORK
                  value: /tmp/storage-checks
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: scripts
              configMap:
                name: canary-checks-scripts
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canary-storage-checks
  namespace: canary-follower
---
# Is Garage deployed here at all?
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-storage-checks
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-storage-checks
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-storage-checks
subjects:
  - kind: ServiceAccount
    name: canary-storage-checks
    namespace: canary-follower
---
# The Garage CLI in each instance's pod: layout, key, bucket — what the init
# jobs do there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-storage-checks
  namespace: garage-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-storage-checks
  namespace: garage-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-storage-checks
subjects:
  - kind: ServiceAccount
    name: canary-storage-checks
    namespace: canary-follower
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-storage-checks
  namespace: garage-backup-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-storage-checks
  namespace: garage-backup-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-storage-checks
subjects:
  - kind: ServiceAccount
    name: canary-storage-checks
    namespace: canary-follower
---
# One replicator Job from its suspended CronJob, with the probe's rclone config.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-storage-checks
  namespace: backup-replicator
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["replicator-config-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-storage-checks
  namespace: backup-replicator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-storage-checks
subjects:
  - kind: ServiceAccount
    name: canary-storage-checks
    namespace: canary-follower
---
# What the first run wrote, so an instance that lost it cannot pass by writing
# it again.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-storage-checks
  namespace: canary-follower
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["canary-storage-probe"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-storage-checks
  namespace: canary-follower
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-storage-checks
subjects:
  - kind: ServiceAccount
    name: canary-storage-checks
    namespace: canary-follower
