apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-follower-config
  namespace: canary-follower
data:
  GITHUB_REPO: "stephan271/smallworlds"
  BRANCH: "main"
  STATUS_CONTEXT: "ring0/verified"
  ROOT_APP: "smallworlds-root"
  POLL_SECONDS: "300"
  # Bounds and periods (design §3.5). The quiet period must outlast the critical
  # alerts an update can set off: CNPGWALArchivingFailing fires after 15 minutes
  # (the 2026-08-09 outage), so 20 is the floor. It was 30 until 2026-11-13; at
  # one update per verified commit that made a backlog of eight take six hours.
  CONVERGE_TIMEOUT_SECONDS: "2700"
  QUIET_SECONDS: "1200"
  ALERTMANAGER_URL: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"
  # Before smoke and checks: wait (at most SETTLE_TIMEOUT_SECONDS) until the
  # 1-minute load per CPU stays below SETTLE_LOAD_PERCENT. Ring 0 idles near 100;
  # a sync of every Application drove it to 480 on 2026-11-13.
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  SETTLE_LOAD_PERCENT: "150"
  SETTLE_TIMEOUT_SECONDS: "900"
  # Before syncing a commit that touches a migrating tenant: an on-demand CNPG
  # Backup ring0-before-<sha> of each of its clusters (design §3.6).
  PRE_UPDATE_BACKUPS: "true"
  # E2E with full OIDC and the data checks, as a Job cut from checks-job.yaml.
  CHECKS_CRONJOB: "canary-checks"
  CHECKS_TIMEOUT_SECONDS: "3600"
  # One Renovate update at a time while main is green; a rejected one is
  # reverted unless it touches a migrating tenant (src/mergequeue.py). Both need
  # the token's contents and pull-request permissions (README).
  MERGE_QUEUE: "true"
  AUTO_REVERT: "true"
  # Incidents and the Ring 0 Steward (src/incidents.py, design-per-app-updates.md
  # §5). INCIDENTS opens and closes the issues in OVERLAY_REPO (the token needs
  # Issues there too); STEWARD also asks the Steward's workflow to act on them.
  # Its PRs arrive as STEWARD_LOGIN; on PROTECTED_PATHS they need OWNER_LOGIN's
  # approval before the queue merges them.
  OVERLAY_REPO: "stephan271/my-canary-installation"
  INCIDENTS: "true"
  STEWARD: "false"
  STEWARD_LOGIN: "smallworlds-steward[bot]"
  OWNER_LOGIN: "stephan271"
  STEWARD_ATTEMPTS: "3"
  STEWARD_RUNS_PER_DAY: "6"
