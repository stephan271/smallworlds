# Refresh and sync Argo CD Applications (patch), read their state, and list
# Ingresses for the smoke step. Nothing else: no Secrets, no workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canary-follower
  namespace: canary-follower
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-follower
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-follower
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-follower
subjects:
  - kind: ServiceAccount
    name: canary-follower
    namespace: canary-follower
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canary-follower-ingresses
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canary-follower-ingresses
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canary-follower-ingresses
subjects:
  - kind: ServiceAccount
    name: canary-follower
    namespace: canary-follower
