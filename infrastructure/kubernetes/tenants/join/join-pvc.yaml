# invitations.db — open invitations and the Desk's history, nothing else.
# Deliberately not backed up: losing it loses open invitations, never a member,
# because members exist only in Keycloak (design §6).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: join-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
