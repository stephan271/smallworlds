<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Invitation</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js" defer></script>
  <script src="/static/done.js" defer></script>
</head>
<body>
  <header class="bar">
    <span class="host" id="host"></span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h1 data-t="done.title"></h1>
    <p data-t="done.text"></p>
    <p class="notice" data-t="done.codes"></p>
    <!-- With the Member Network on (docs/adr/0066): the applications open only
         on devices that have joined it, so this comes before the dashboard. -->
    <section class="member-network" id="member-network" hidden>
      <h2 data-t="mn.title"></h2>
      <p data-t="mn.intro"></p>
      <details data-platform="android">
        <summary data-t="mn.android"></summary>
        <ol class="steps">
          <li><span data-t="mn.install"></span>
            <a href="https://play.google.com/store/apps/details?id=com.tailscale.ipn" rel="noopener" data-t="mn.store.play"></a></li>
          <li data-t="mn.android.server"></li>
          <li data-t="mn.enter"></li>
          <li data-t="mn.passkey"></li>
        </ol>
      </details>
      <details data-platform="ios">
        <summary data-t="mn.ios"></summary>
        <ol class="steps">
          <li><span data-t="mn.install"></span>
            <a href="https://apps.apple.com/app/tailscale/id1470499037" rel="noopener" data-t="mn.store.apple"></a></li>
          <li data-t="mn.ios.server"></li>
          <li data-t="mn.enter"></li>
          <li data-t="mn.passkey"></li>
        </ol>
      </details>
      <details data-platform="computer">
        <summary data-t="mn.computer"></summary>
        <ol class="steps">
          <li><span data-t="mn.install"></span>
            <a href="https://tailscale.com/download" rel="noopener" data-t="mn.store.download"></a></li>
          <li><span data-t="mn.computer.command"></span>
            <code id="login-command"></code></li>
          <li><span data-t="mn.computer.guide"></span>
            <a id="guide-apple" rel="noopener">macOS</a> ·
            <a id="guide-windows" rel="noopener">Windows</a></li>
          <li data-t="mn.passkey"></li>
        </ol>
      </details>
      <p class="notice" data-t="mn.update"></p>
    </section>
    <a class="button primary" id="dashboard" href="/" data-t="done.dashboard"></a>
  </main>
</body>
</html>
