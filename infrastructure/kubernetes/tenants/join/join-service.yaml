apiVersion: v1
kind: Service
metadata:
  name: join
  labels:
    app: join
spec:
  selector:
    app: join
  ports:
    # The join page only; join-ingress.yaml.
    - name: http
      port: 8080
      targetPort: http
    # The Invitation Desk; join-desk-ingress.yaml, behind the Private Network.
    # The public Ingress never names this port (design §9).
    - name: desk
      port: 8081
      targetPort: desk
