apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-secret-init
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: setup-sa
      containers:
        - name: secret-gen
          image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              if ! kubectl get secret nextcloud-admin-creds -n nextcloud >/dev/null 2>&1; then
                echo "Generating Nextcloud password..."
                PASSWORD=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)
                ADMIN_EMAIL=$(kubectl get cm smallworlds-global-config -n default -o jsonpath='{.data.ADMIN_EMAIL}')
                
                kubectl create secret generic nextcloud-admin-creds -n nextcloud \
                  --from-literal=nextcloud-username="$ADMIN_EMAIL" \
                  --from-literal=nextcloud-password="$PASSWORD"
              else
                echo "nextcloud-admin-creds already exists, skipping."
              fi
      restartPolicy: OnFailure
