apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-oidc-config-map
  namespace: nextcloud
data:
  IDENTITY_URL: "https://identity.smallworlds.network/realms/smallworlds"
  FILES_DOMAIN: "files.smallworlds.network"
  OFFICE_URL: "https://office.smallworlds.network"
  # Backwards-compatible for overlays created before office selection existed.
  # New overlays always replace this with none, collabora, or euro-office.
  OFFICE_BACKEND: "collabora"
