apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system

# The plugin's own release manifest, pinned to an exact version. It carries the
# ObjectStore CRD, the barman-cloud Deployment, its RBAC, and the cert-manager
# Issuer/Certificates it uses to talk to the operator over CNPG-I — which is why
# cert-manager has to be up first (wave -9, see apps/cnpg-barman-plugin.yaml).
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.14.0/manifest.yaml
