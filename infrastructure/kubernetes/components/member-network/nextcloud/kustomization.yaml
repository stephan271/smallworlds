# Nextcloud on the Member Network (docs/adr/0066). An overlay with the Member
# Network on includes this Component in its nextcloud/ kustomization:
#
#   components:
#     - https://github.com/stephan271/smallworlds.git/infrastructure/kubernetes/components/member-network/nextcloud?ref=<tag>
#
# and patches the host of `nextcloud-guest` as it does that of `nextcloud`.
#
# The full application moves to the `members` entrypoint, which members'
# devices reach through the Member Gateway and pods through traefik-members.
# The public entrypoint keeps only the Guest Paths (guest-ingress.yaml).
#
# The members' router drops edge-ratelimit and keeps edge-headers. The Member
# Gateway forwards plain TCP, so Traefik sees every member as the gateway's one
# pod address, and a per-source limit became one limit shared by all members:
# one person's sync could answer 429 to everybody else. Only enrolled devices
# reach `members`; the guest routes keep the limit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - guest-ingress.yaml

patches:
  - target:
      kind: Ingress
      name: nextcloud
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: members
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: nextcloud-edge-headers@kubernetescrd
