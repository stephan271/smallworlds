# A members-only application on the Member Network (docs/adr/0066): Forgejo,
# Excalidraw, the dashboard, pod-gateway and Bulwark. None of them has Guest
# Paths, so the whole application moves to the `members` entrypoint, which
# members' devices reach through the Member Gateway and pods through
# traefik-members. The public entrypoint has no router for it any more and
# answers 404.
#
# An overlay with the Member Network on includes it in the tenant's
# kustomization:
#
#   components:
#     - https://github.com/stephan271/smallworlds.git/infrastructure/kubernetes/components/member-network/members-only?ref=<tag>
#
# It moves every Ingress of the tenant, so it fits a tenant that has no public
# part at all. Stalwart has one (port 25) and has its own Component.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: members
