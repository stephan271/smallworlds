# Stalwart on the Member Network (docs/adr/0066). Only port 25 stays public,
# because other mail servers deliver there. Members' mail clients reach
# submission (465) and IMAP (993) through the Member Gateway, and webmail and
# JMAP (`mail.<domain>`) through the `members` entrypoint.
#
# An overlay with the Member Network on includes it in its stalwart/
# kustomization:
#
#   components:
#     - https://github.com/stephan271/smallworlds.git/infrastructure/kubernetes/components/member-network/stalwart?ref=<tag>
#
# 465 and 993 are closed by taking them off the LoadBalancer Service, which
# is what publishes a port on the node, so they are closed whatever the
# firewall allows. The cluster's own senders use port 25 on the same Service
# and are not affected.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../members-only

resources:
  - members-mail-service.yaml

patches:
  - target:
      kind: Service
      name: stalwart-mail
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: stalwart-mail
      spec:
        ports:
          - port: 465
            $patch: delete
          - port: 993
            $patch: delete
